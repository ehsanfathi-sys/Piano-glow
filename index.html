<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b14"><title>Piano Glow</title>
<style>
:root{--glow:#60a5fa}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{touch-action:manipulation}#app{height:100svh;display:grid;grid-template-rows:auto 1fr 30vh;background:radial-gradient(circle at 20% 10%,rgba(96,165,250,.15),transparent 36%),#090b14}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid rgba(255,255,255,.16)}h1{margin:0;font-size:1.25rem}p{margin:3px 0 0;color:#aeb8d0;font-size:.85rem}.controls{display:flex;gap:10px;align-items:center}button{border:1px solid rgba(255,255,255,.18);background:#171b2d;color:#fff;border-radius:14px;padding:11px 14px;font:inherit;font-weight:800}button:disabled{opacity:.65}#listen.on{background:#dc2626}#colour{width:48px;height:48px;padding:6px;background:conic-gradient(red,#ff0,#0f0,#0ff,#00f,#f0f,red)}#colour i{display:block;width:100%;height:100%;border-radius:9px;background:var(--glow);border:3px solid white}#palette{display:none;position:absolute;right:16px;top:74px;z-index:30;width:220px;padding:12px;border-radius:18px;background:#171b2d;border:1px solid rgba(255,255,255,.18);grid-template-columns:repeat(5,1fr);gap:9px}#palette.open{display:grid}.swatch{height:34px;padding:0;border-radius:9px}#visual{position:relative;overflow:hidden}.pill{position:absolute;top:16px;z-index:10;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.16);color:#b7c0d6;max-width:90%;text-align:center}#status{left:50%;transform:translateX(-50%)}#readout{left:16px;border-radius:14px}.bar{position:absolute;bottom:-8px;width:25px;min-height:54px;border-radius:9px 9px 3px 3px;background:var(--glow);display:grid;place-items:center;font-weight:900;text-shadow:0 1px 3px #000;box-shadow:0 0 20px var(--glow);animation:rise 2.8s linear forwards}@keyframes rise{to{transform:translateY(-72vh);opacity:0}}#keyboardWrap{overflow-x:auto;overflow-y:hidden;background:#060810;-webkit-overflow-scrolling:touch}#keyboard{height:100%;min-width:1300px;position:relative;display:flex;padding-bottom:max(8px,env(safe-area-inset-bottom))}.white{position:relative;flex:1;height:100%;background:linear-gradient(#fff,#e8e8ef);border-right:1px solid #999;color:#171923;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:800}.black{position:absolute;top:0;height:62%;width:1.25%;transform:translateX(-50%);z-index:5;background:linear-gradient(#272a36,#030407);border-radius:0 0 5px 5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:.55rem;font-weight:800}.active{background:var(--glow)!important}@media(orientation:portrait){#app{grid-template-rows:auto 1fr 24vh}#keyboard{min-width:1500px}}
</style></head><body><div id="app"><header><div><h1>Piano Glow</h1><p>Play your piano and watch the notes rise.</p></div><div class="controls"><button id="listen" type="button">Start listening</button><button id="colour" type="button" aria-label="Choose colour"><i></i></button></div></header><div id="palette"></div><section id="visual"><div id="readout" class="pill">Note: —</div><div id="status" class="pill">Tap Start listening</div></section><section id="keyboardWrap"><div id="keyboard"></div></section></div>
<script>
(function(){'use strict';
var names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],whites={C:1,D:1,E:1,F:1,G:1,A:1,B:1},colours=['#60a5fa','#22d3ee','#34d399','#a3e635','#facc15','#fb923c','#f87171','#f472b6','#c084fc','#818cf8','#fff','#94a3b8','#14b8a6','#84cc16','#eab308'];
var keyboard=document.getElementById('keyboard'),wrap=document.getElementById('keyboardWrap'),visual=document.getElementById('visual'),listen=document.getElementById('listen'),status=document.getElementById('status'),readout=document.getElementById('readout'),palette=document.getElementById('palette'),colour=document.getElementById('colour');
var keys={},whiteMidis=[],stream,ctx,analyser,data,spectrum,raf,listening=false,lastBar=0,smoothLevel=0,armedUntil=0,quietFrames=0,pitchFrames=[],attackPassed=false;
function info(m){return{name:names[m%12],oct:Math.floor(m/12)-1};}
for(var m=21;m<=108;m++)if(whites[info(m).name])whiteMidis.push(m);whiteMidis.forEach(function(m){var e=document.createElement('div'),n=info(m);e.className='white';e.textContent=n.name==='C'?n.name+n.oct:n.name;keyboard.appendChild(e);keys[m]=e;});for(var x=21;x<=108;x++){var n=info(x);if(!whites[n.name]){var b=document.createElement('div'),count=whiteMidis.filter(function(v){return v<x;}).length;b.className='black';b.textContent=n.name;b.style.left=(count/whiteMidis.length*100)+'%';keyboard.appendChild(b);keys[x]=b;}}
setTimeout(function(){var c=keys[60];if(c)wrap.scrollLeft=Math.max(0,c.offsetLeft-wrap.clientWidth/2);},80);colours.forEach(function(c){var b=document.createElement('button');b.type='button';b.className='swatch';b.style.background=c;b.onclick=function(){document.documentElement.style.setProperty('--glow',c);palette.classList.remove('open');};palette.appendChild(b);});colour.onclick=function(){palette.classList.toggle('open');};
function midiFloat(f){return 69+12*Math.log(f/440)/Math.log(2);}function midiHz(m){return 440*Math.pow(2,(m-69)/12);}function levelOf(buf){var s=0;for(var i=0;i<buf.length;i++)s+=buf[i]*buf[i];return Math.sqrt(s/buf.length);}
function corrAt(buf,lag){var sum=0,a=0,b=0;for(var j=0;j<buf.length-lag;j++){var x=buf[j],y=buf[j+lag];sum+=x*y;a+=x*x;b+=y*y;}return sum/Math.sqrt(a*b+1e-12);}
function pitch(buf,sr,rms){if(rms<.006)return null;var min=Math.floor(sr/4200),max=Math.min(Math.floor(sr/27),Math.floor(buf.length/2)),bestLag=0,bestScore=0;for(var lag=min;lag<=max;lag++){var score=corrAt(buf,lag);if(score>bestScore){bestScore=score;bestLag=lag;}}if(!bestLag||bestScore<.74)return null;return{f:sr/bestLag,q:bestScore};}
function binPeak(hz){var binHz=(ctx.sampleRate/2)/spectrum.length,centre=Math.round(hz/binHz),best=0;for(var d=-2;d<=2;d++){var i=centre+d;if(i>0&&i<spectrum.length&&spectrum[i]>best)best=spectrum[i];}return best;}
function spectralFeatures(){analyser.getByteFrequencyData(spectrum);var sum=0,max=0,used=0,low=0,mid=0,high=0;var binHz=(ctx.sampleRate/2)/spectrum.length;for(var i=1;i<spectrum.length;i++){var hz=i*binHz,v=spectrum[i];if(hz<80||hz>6000)continue;sum+=v;used++;if(v>max)max=v;if(hz<500)low+=v;else if(hz<1800)mid+=v;else high+=v;}var mean=sum/Math.max(1,used);return{mean:mean,crest:max/(mean+1),low:low,mid:mid,high:high};}
function pianoAttack(rms){var f=spectralFeatures();var bright=f.high/(f.low+f.mid+1);return rms>.007&&f.crest>2.8&&bright>.05;}
function harmonicScore(m){var f=midiHz(m);if(f<27||f>4200)return null;var weights=[1,.82,.62,.48,.34,.24],sum=0,hits=0,peaks=[];for(var h=1;h<=weights.length;h++){var hz=f*h;if(hz>6000)break;var p=binPeak(hz);peaks.push(p);sum+=p*weights[h-1];if(p>11)hits++;}var fundamental=peaks[0]||0;var requiredHits=f<130?3:(f<350?2:1);if(hits<requiredHits)return null;if(f<180&&fundamental<5&&hits<4)return null;return{score:sum,hits:hits,fundamental:fundamental};}
function spectralPitchClass(){analyser.getByteFrequencyData(spectrum);var classScores=[],pc,bestPc=-1,best=-1,second=-1;for(pc=0;pc<12;pc++){var total=0,valid=0;for(var m=36+pc;m<=96;m+=12){var r=harmonicScore(m);if(r){total=Math.max(total,r.score);valid++;}}classScores[pc]=valid?total:0;if(classScores[pc]>best){second=best;best=classScores[pc];bestPc=pc;}else if(classScores[pc]>second)second=classScores[pc];}if(best<38)return null;if(second>0&&best<second*1.22)return null;return bestPc;}
function chooseTrueNote(rawMidi){analyser.getByteFrequencyData(spectrum);var pitchClass=((Math.round(rawMidi)%12)+12)%12,candidates=[];for(var m=21;m<=108;m++)if(m%12===pitchClass)candidates.push(m);var best=null,second=-1;for(var i=0;i<candidates.length;i++){var c=candidates[i],r=harmonicScore(c);if(!r)continue;var distance=Math.abs(c-rawMidi),score=r.score-Math.min(22,distance*1.2);if(c<45)score+=r.hits*4;if(score>(best?best.score:-1)){second=best?best.score:second;best={m:c,score:score};}else if(score>second)second=score;}if(!best||best.score<34)return null;if(second>0&&best.score<second*1.12)return null;return best.m;}
function activate(m){Object.keys(keys).forEach(function(k){keys[k].classList.remove('active');});if(keys[m])keys[m].classList.add('active');}function makeBar(m,r){var k=keys[m];if(!k)return;var kr=k.getBoundingClientRect(),wr=wrap.getBoundingClientRect(),px=kr.left+kr.width/2-wr.left,e=document.createElement('div');e.className='bar';e.textContent=info(m).name;e.style.left=(px-12)+'px';e.style.height=(52+Math.min(75,r*900))+'px';visual.appendChild(e);e.onanimationend=function(){e.remove();};}function clearNote(){activate(-1);readout.textContent='Note: —';pitchFrames=[];}
function stddev(v){var mean=v.reduce(function(a,b){return a+b;},0)/v.length;return Math.sqrt(v.reduce(function(a,b){var d=b-mean;return a+d*d;},0)/v.length);}
function tryAccept(rms){if(!attackPassed||pitchFrames.length<8)return;var recent=pitchFrames.slice(-8),rounded=recent.map(function(v){return Math.round(v);}),counts={},winner=null,count=0;rounded.forEach(function(n){counts[n]=(counts[n]||0)+1;if(counts[n]>count){count=counts[n];winner=n;}});var matching=recent.filter(function(v){return Math.round(v)===winner;}),cents=matching.map(function(v){return(v-winner)*100;});if(count<7||matching.length<7||stddev(cents)>5)return;var min=Math.min.apply(null,matching),max=Math.max.apply(null,matching);if(max-min>.16)return;var rawClass=((winner%12)+12)%12,spectralClass=spectralPitchClass();if(spectralClass===null||spectralClass!==rawClass){pitchFrames=[];return;}winner=chooseTrueNote(winner);if(winner===null)return;var n=info(winner);activate(winner);readout.textContent='Note: '+n.name+n.oct;var now=Date.now();if(now-lastBar>240){makeBar(winner,rms);lastBar=now;}pitchFrames=[];armedUntil=0;attackPassed=false;}
function loop(){if(!listening)return;analyser.getFloatTimeDomainData(data);var rms=levelOf(data),prev=smoothLevel;smoothLevel=smoothLevel*.90+rms*.10;var attack=rms>.007&&rms>Math.max(prev*1.18,prev+.0015);if(attack){attackPassed=pianoAttack(rms);if(attackPassed){armedUntil=Date.now()+950;pitchFrames=[];}}if(rms<.0045)quietFrames++;else quietFrames=0;if(quietFrames>10){clearNote();armedUntil=0;attackPassed=false;}if(Date.now()<=armedUntil&&attackPassed){var p=pitch(data,ctx.sampleRate,rms);if(p){var mf=midiFloat(p.f);if(mf>=21&&mf<=108){pitchFrames.push(mf);if(pitchFrames.length>10)pitchFrames.shift();tryAccept(rms);}}}raf=requestAnimationFrame(loop);}
function friendlyError(e){var n=e&&e.name||'UnknownError';if(n==='NotAllowedError')return'Microphone permission was denied.';if(n==='NotReadableError')return'The microphone is busy in another app.';return'Microphone error: '+n+(e&&e.message?' — '+e.message:'');}
async function start(){listen.disabled=true;listen.textContent='Starting…';status.textContent='Waiting for microphone…';try{stream=await navigator.mediaDevices.getUserMedia({audio:true});var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();if(ctx.state==='suspended')await ctx.resume();var source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=0;data=new Float32Array(analyser.fftSize);spectrum=new Uint8Array(analyser.frequencyBinCount);source.connect(analyser);listening=true;smoothLevel=0;armedUntil=0;quietFrames=0;pitchFrames=[];attackPassed=false;listen.disabled=false;listen.textContent='Stop';listen.classList.add('on');status.textContent='Microphone is listening';loop();}catch(e){listen.disabled=false;listen.textContent='Try again';status.textContent=friendlyError(e);}}
function stop(){listening=false;if(raf)cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(function(t){t.stop();});if(ctx)ctx.close();stream=ctx=null;listen.disabled=false;listen.textContent='Start listening';listen.classList.remove('on');status.textContent='Tap Start listening';clearNote();}listen.onclick=function(){listening?stop():start();};window.onerror=function(msg){status.textContent='App error: '+msg;};
})();
</script></body></html>
