<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piano Glow</title><body style="margin:0;background:#090b14;color:white;font-family:sans-serif"><div id="loading" style="padding:24px">Loading Piano Glow…</div><script>(async()=>{try{let s="";for(const p of["app.gz.1","app.gz.2","app.gz.3"])s+=await(await fetch(p,{cache:"no-store"})).text();const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();document.open();document.write(t);document.close()}catch(e){loading.textContent="Piano Glow could not load: "+e.message}})();</script>
