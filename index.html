<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Piano Glow</title>
<style>

</style></head><body>
<div id="app"><header><div><h1>Piano Glow</h1><p>One key strike creates one note.</p></div><div class="controls"><button id="listen">Start listening</button><button id="colour" aria-label="Choose colour"><i></i></button></div></header><div id="palette"></div><section id="visual"><div id="readout" class="pill">Note: —</div><div id="status" class="pill">Tap Start listening</div><div id="tuningPanel">

<div class="sliderRow"><label for="speed"><span>Response speed</span><output id="speedValue">70</output></label><input id="speed" type="range" min="0" max="100" step="1" value="70"></div>
<div class="sliderRow"><label for="duplicateGuard"><span>Duplicate guard</span><output id="duplicateGuardValue">65</output></label><input id="duplicateGuard" type="range" min="0" max="100" step="1" value="65"></div>

</div></section><section id="keyboardWrap"><div id="keyboard"></div></section></div>
<script>
(function(){'use strict';

function centreMiddleC(){var c=keys[60];if(c)wrap.scrollLeft=Math.max(0,c.offsetLeft-wrap.clientWidth/2);}

function readAudio(){if(typeof analyser.getFloatTimeDomainData==='function'){analyser.getFloatTimeDomainData(timeData);return timeData;}analyser.getByteTimeDomainData(byteData);for(var i=0;i<byteData.length;i++)timeData[i]=(byteData[i]-128)/128;return timeData;}

function clearActive(){Object.keys(keys).forEach(function(k){keys[k].classList.remove('active');});}
function activate(m){clearActive();if(highlightTimer)clearTimeout(highlightTimer);if(keys[m])keys[m].classList.add('active');highlightTimer=setTimeout(function(){if(keys[m])keys[m].classList.remove('active');highlightTimer=0;},60);}

function showNote(m,level){current=m;activate(m);var n=info(m);readout.textContent='Note: '+n.name+n.oct;addBar(m,level);}
function addCandidate(buf,source){var p=detectPitch(buf,ctx.sampleRate),qualityFloor=.46+settings.accuracy*.10;if(!p||p.quality<qualityFloor)return;var mf=midiFloat(p.freq),m=Math.round(mf),distanceLimit=.34-settings.accuracy*.08;if(m<21||m>108||Math.abs(mf-m)>distanceLimit)return;candidates.push({note:m,quality:p.quality,distance:Math.abs(mf-m),source:source});}
function chooseCandidate(){if(!candidates.length)return null;var totals={};candidates.forEach(function(c){if(!totals[c.note])totals[c.note]={note:c.note,count:0,score:0,distance:0,sources:{}};totals[c.note].count++;totals[c.note].score+=c.quality;totals[c.note].distance+=c.distance;totals[c.note].sources[c.source]=1;});var ranked=Object.keys(totals).map(function(k){var r=totals[k];r.distance/=r.count;r.sourceCount=Object.keys(r.sources).length;r.averageQuality=r.score/r.count;return r;});ranked.sort(function(a,b){return b.count-a.count||b.sourceCount-a.sourceCount||b.score-a.score||a.distance-b.distance;});var best=ranked[0],second=ranked[1],high=best.note>=72,soft=strikePeak<captureThreshold*(2.4+settings.softBoost*1.2),strict=settings.accuracy,minHigh=soft?2:Math.round(2+strict),minLow=soft?Math.round(2+strict):Math.round(3+strict),qualityNeed=(soft?.50:.54)+strict*.07,distanceNeed=(soft?.31:.28)-strict*.05;if(high){if(best.count<minHigh||best.averageQuality<qualityNeed||best.distance>distanceNeed||(!best.sources.s&&!best.sources.m))return null;}else{if(best.count<minLow||best.sourceCount<2||best.averageQuality<qualityNeed-.01||best.distance>distanceNeed+.01)return null;}if(second){if(Math.abs(best.note-second.note)===12){var bestFast=(best.sources.s?1:0)+(best.sources.m?1:0),secondFast=(second.sources.s?1:0)+(second.sources.m?1:0);if(second.count>best.count||(second.count===best.count&&secondFast>bestFast)||(second.count===best.count&&secondFast===bestFast&&second.score>best.score*1.08))best=second;}else if(best.count-second.count<2&&best.score<second.score*(1.08+strict*.18))return null;}return best.note;}
function loop(){if(!listening)return;try{var buf=readAudio(),level=rms(buf),recent=rms(buf,buf.length-512),sensitivity=settings.sensitivity,softBoost=settings.softBoost,thresholdFloor=.00013-sensitivity*.000065-softBoost*.00002,thresholdMultiplier=1.18-sensitivity*.10-softBoost*.03,threshold=Math.max(thresholdFloor,noiseFloor*thresholdMultiplier),now=performance.now();if(level<threshold*1.12)noiseFloor=noiseFloor*.988+level*.012;var relativeBase=Math.max(threshold,envelope*(.86-sensitivity*.10-softBoost*.04)),jump=recent-lastRecent,riseRatio=1.16-sensitivity*.075-softBoost*.025,lastRatio=1.045-sensitivity*.025-softBoost*.01,jumpFloor=Math.max(.000032-sensitivity*.000018-softBoost*.000006,noiseFloor*(.20-sensitivity*.09-softBoost*.03)),rising=recent>relativeBase*riseRatio&&recent>lastRecent*lastRatio&&jump>jumpFloor,cooldownMs=118-settings.speed*55+settings.guard*24,cooldown=now-lastAttack>cooldownMs;if(!strikeArmed){strikePeak=Math.max(strikePeak,recent);var releaseLevel=Math.max(threshold*(1.15+settings.guard*.13),strikePeak*(.50-settings.guard*.10)),fellEnough=recent<releaseLevel,clearDip=now-lastAttack>(78+settings.guard*38)&&recent<envelope*(.94-settings.guard*.08),newAttack=now-lastAttack>cooldownMs&&recent>lastRecent*(1.045+settings.guard*.045)&&jump>Math.max(.000018+settings.guard*.000025,noiseFloor*(.18+settings.guard*.20))&&recent>Math.max(threshold*(1.18+settings.guard*.20),envelope*(1.035+settings.guard*.055));if(!capturing&&newAttack){strikeArmed=true;releaseFrames=0;strikePeak=Math.max(noiseFloor,lastRecent);}else{if(!capturing&&(fellEnough||clearDip))releaseFrames++;else releaseFrames=0;if(releaseFrames>=Math.round(1+settings.guard*2)){strikeArmed=true;releaseFrames=0;strikePeak=Math.max(noiseFloor,recent);lastRecent=recent;}}}if(strikeArmed&&!capturing&&rising&&cooldown){strikeArmed=false;strikePeak=recent;captureThreshold=threshold;releaseFrames=0;capturing=true;captureFrame=0;candidates=[];lastAttack=now;}if(capturing){captureFrame++;strikePeak=Math.max(strikePeak,recent);copyTail(buf,shortData);copyTail(buf,mediumData);copyTail(buf,longData);var captureFrames=Math.round(7-settings.speed*3);if(captureFrame>=1&&captureFrame<=captureFrames){addCandidate(shortData,'s');addCandidate(mediumData,'m');addCandidate(longData,'l');}if(captureFrame>=captureFrames){var chosen=chooseCandidate();if(chosen!==null)showNote(chosen,level);capturing=false;candidates=[];}}envelope=envelope*.95+recent*.05;lastRecent=lastRecent*.55+recent*.45;syncBars();raf=requestAnimationFrame(loop);}catch(e){listening=false;status.textContent='App error: '+(e.message||e.name||'Unknown');listen.textContent='Try again';listen.classList.remove('on');listen.disabled=false;}}
async function start(){listen.disabled=true;listen.textContent='Starting…';status.textContent='Waiting for microphone…';try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Microphone not supported in this browser');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true,channelCount:1}});var AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Audio not supported');ctx=new AC();if(ctx.state==='suspended')await ctx.resume();var source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=0;timeData=new Float32Array(analyser.fftSize);byteData=new Uint8Array(analyser.fftSize);yin=new Float32Array(analyser.fftSize/2+1);shortData=new Float32Array(2048);mediumData=new Float32Array(4096);longData=new Float32Array(6144);source.connect(analyser);listening=true;noiseFloor=.00008;envelope=.00008;lastRecent=.00008;lastAttack=0;capturing=false;captureFrame=0;candidates=[];current=-1;strikeArmed=true;strikePeak=.00008;captureThreshold=.00009;releaseFrames=0;listen.disabled=false;listen.textContent='Stop';listen.classList.add('on');status.textContent='Listening with adjustable detection controls';loop();}catch(e){listen.disabled=false;listen.textContent='Try again';status.textContent='Microphone error: '+(e.message||e.name||'Unknown');}}

})();
