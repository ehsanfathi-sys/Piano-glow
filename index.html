<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Piano Glow</title>
<style>
:root{--glow:#60a5fa}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{position:fixed;inset:0}#app{position:absolute;inset:0;width:100vw;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr 30vh}header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #ffffff25}h1{margin:0;font-size:1.25rem}p{margin:3px 0 0;color:#aeb8d0;font-size:.85rem}.controls{display:flex;gap:10px}button{border:1px solid #ffffff28;background:#171b2d;color:#fff;border-radius:14px;padding:11px 14px;font:inherit;font-weight:800}#listen.on{background:#dc2626}#colour{width:48px;height:48px;padding:6px}#colour i{display:block;width:100%;height:100%;border-radius:8px;background:var(--glow);border:3px solid #fff}#palette{display:none;position:absolute;right:16px;top:72px;z-index:30;width:220px;padding:12px;border-radius:18px;background:#171b2d;border:1px solid #ffffff2b;grid-template-columns:repeat(5,1fr);gap:9px}#palette.open{display:grid}.swatch{height:34px;padding:0;border-radius:9px}#visual{position:relative;overflow:hidden;background:radial-gradient(circle at 20% 10%,#60a5fa26,transparent 36%)}.pill{position:absolute;top:16px;z-index:10;padding:8px 12px;border-radius:999px;background:#0008;border:1px solid #ffffff29;color:#c5cce0}#status{left:50%;transform:translateX(-50%);white-space:nowrap}#readout{left:16px}.bar{position:absolute;bottom:-8px;width:25px;min-height:54px;border-radius:9px 9px 3px 3px;background:var(--glow);display:grid;place-items:center;font-weight:900;text-shadow:0 1px 3px #000;box-shadow:0 0 20px var(--glow);animation:rise 2.8s linear forwards}@keyframes rise{to{transform:translateY(-72vh);opacity:0}}#keyboardWrap{overflow-x:auto;overflow-y:hidden;background:#060810;-webkit-overflow-scrolling:touch}#keyboard{height:100%;min-width:1300px;position:relative;display:flex}.white{position:relative;flex:1;height:100%;background:linear-gradient(#fff,#e8e8ef);border-right:1px solid #999;color:#171923;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:800}.black{position:absolute;top:0;height:62%;width:1.25%;transform:translateX(-50%);z-index:5;background:linear-gradient(#272a36,#030407);border-radius:0 0 5px 5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:.55rem;font-weight:800}.active{background:var(--glow)!important}@media(orientation:portrait){#app{grid-template-rows:auto 1fr 24vh}#keyboard{min-width:1500px}}
</style></head><body>
<div id="app"><header><div><h1>Piano Glow</h1><p>One key strike creates one note.</p></div><div class="controls"><button id="listen">Start listening</button><button id="colour" aria-label="Choose colour"><i></i></button></div></header><div id="palette"></div><section id="visual"><div id="readout" class="pill">Note: —</div><div id="status" class="pill">Tap Start listening</div></section><section id="keyboardWrap"><div id="keyboard"></div></section></div>
<script>
(function(){'use strict';
var names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],whites={C:1,D:1,E:1,F:1,G:1,A:1,B:1},colours=['#60a5fa','#22d3ee','#34d399','#a3e635','#facc15','#fb923c','#f87171','#f472b6','#c084fc','#818cf8','#fff','#94a3b8','#14b8a6','#84cc16','#eab308'];
var keyboard=document.getElementById('keyboard'),wrap=document.getElementById('keyboardWrap'),visual=document.getElementById('visual'),listen=document.getElementById('listen'),status=document.getElementById('status'),readout=document.getElementById('readout'),palette=document.getElementById('palette'),colour=document.getElementById('colour');
var keys={},whiteMidis=[],stream,ctx,analyser,timeData,byteData,yin,attackData,raf,listening=false,noiseFloor=.00018,envelope=.00018,lastRecent=.00018,lastAttack=0,capturing=false,captureFrame=0,votes=[],current=-1;
function info(m){return{name:names[m%12],oct:Math.floor(m/12)-1};}
for(var m=21;m<=108;m++)if(whites[info(m).name])whiteMidis.push(m);
whiteMidis.forEach(function(m){var e=document.createElement('div'),n=info(m);e.className='white';e.textContent=n.name==='C'?n.name+n.oct:n.name;keyboard.appendChild(e);keys[m]=e;});
for(var x=21;x<=108;x++){var n=info(x);if(!whites[n.name]){var b=document.createElement('div'),count=whiteMidis.filter(function(v){return v<x;}).length;b.className='black';b.textContent=n.name;b.style.left=(count/whiteMidis.length*100)+'%';keyboard.appendChild(b);keys[x]=b;}}
setTimeout(function(){var c=keys[60];if(c)wrap.scrollLeft=Math.max(0,c.offsetLeft-wrap.clientWidth/2);},80);
colours.forEach(function(c){var b=document.createElement('button');b.className='swatch';b.style.background=c;b.onclick=function(){document.documentElement.style.setProperty('--glow',c);palette.classList.remove('open');};palette.appendChild(b);});colour.onclick=function(){palette.classList.toggle('open');};
function readAudio(){if(typeof analyser.getFloatTimeDomainData==='function'){analyser.getFloatTimeDomainData(timeData);return timeData;}analyser.getByteTimeDomainData(byteData);for(var i=0;i<byteData.length;i++)timeData[i]=(byteData[i]-128)/128;return timeData;}
function rms(buf,start){var s=0,i=start||0,count=buf.length-i;for(;i<buf.length;i++){var v=buf[i];s+=v*v;}return Math.sqrt(s/Math.max(1,count));}
function detectPitch(buf,sr){var half=buf.length>>1,minTau=Math.max(2,Math.floor(sr/4200)),maxTau=Math.min(Math.floor(sr/27),half-2),tau,i,sum,running=0;for(tau=0;tau<=maxTau;tau++)yin[tau]=0;for(tau=1;tau<=maxTau;tau++){sum=0;for(i=0;i<half;i+=3){var d=buf[i]-buf[i+tau];sum+=d*d;}yin[tau]=sum;}yin[0]=1;for(tau=1;tau<=maxTau;tau++){running+=yin[tau];yin[tau]=yin[tau]*tau/(running||1);}var chosen=-1,best=1;for(tau=minTau;tau<maxTau;tau++){if(yin[tau]<.24&&yin[tau]<=yin[tau-1]&&yin[tau]<yin[tau+1]){chosen=tau;break;}if(yin[tau]<best){best=yin[tau];chosen=tau;}}if(chosen<0||yin[chosen]>.42)return null;while(chosen+1<maxTau&&yin[chosen+1]<yin[chosen])chosen++;var better=chosen,a=yin[chosen-1],b=yin[chosen],c=yin[chosen+1],den=a-2*b+c;if(Math.abs(den)>1e-9)better=chosen+(a-c)/(2*den);return{freq:sr/better,quality:1-yin[chosen]};}
function midiFloat(f){return 69+12*Math.log(f/440)/Math.log(2);}
function activate(m){Object.keys(keys).forEach(function(k){keys[k].classList.remove('active');});if(keys[m])keys[m].classList.add('active');}
function addBar(m,level){var k=keys[m];if(!k)return;var kr=k.getBoundingClientRect(),wr=wrap.getBoundingClientRect(),e=document.createElement('div');e.className='bar';e.textContent=info(m).name;e.style.left=(kr.left+kr.width/2-wr.left-12)+'px';e.style.height=(52+Math.min(75,level*2000))+'px';visual.appendChild(e);e.onanimationend=function(){e.remove();};}
function showNote(m,level){current=m;activate(m);var n=info(m);readout.textContent='Note: '+n.name+n.oct;addBar(m,level);}
function chooseVote(){if(votes.length<2)return null;votes.sort(function(a,b){return a-b;});var centre=votes[Math.floor(votes.length/2)],near=votes.filter(function(v){return Math.abs(v-centre)<.45;});if(near.length<2)return null;var total=0;near.forEach(function(v){total+=v;});var avg=total/near.length,m=Math.round(avg);if(Math.abs(avg-m)>.36)return null;return m;}
function loop(){if(!listening)return;try{var buf=readAudio(),level=rms(buf),recent=rms(buf,buf.length-1024),threshold=Math.max(.00022,noiseFloor*1.2),now=performance.now();if(level<threshold){noiseFloor=noiseFloor*.97+level*.03;}var base=Math.max(threshold,envelope);var rising=recent>base*1.32&&recent>lastRecent*1.12;var cooldown=now-lastAttack>115;if(!capturing&&rising&&cooldown){capturing=true;captureFrame=0;votes=[];lastAttack=now;}
if(capturing){captureFrame++;for(var q=0;q<attackData.length;q++)attackData[q]=buf[buf.length-attackData.length+q];if(captureFrame>=2&&captureFrame<=6){var p=detectPitch(attackData,ctx.sampleRate);if(p&&p.quality>(p.freq<140?.58:.52)){var mf=midiFloat(p.freq);if(mf>=21&&mf<=108)votes.push(mf);}}if(captureFrame>=6){var chosen=chooseVote();if(chosen!==null)showNote(chosen,level);capturing=false;votes=[];}}
envelope=envelope*.93+recent*.07;lastRecent=lastRecent*.55+recent*.45;raf=requestAnimationFrame(loop);}catch(e){listening=false;status.textContent='App error: '+(e.message||e.name||'Unknown');listen.textContent='Try again';listen.classList.remove('on');listen.disabled=false;}}
async function start(){listen.disabled=true;listen.textContent='Starting…';status.textContent='Waiting for microphone…';try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Microphone not supported in this browser');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});var AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Audio not supported');ctx=new AC();if(ctx.state==='suspended')await ctx.resume();var source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=0;timeData=new Float32Array(analyser.fftSize);byteData=new Uint8Array(analyser.fftSize);yin=new Float32Array(analyser.fftSize/2+1);attackData=new Float32Array(6144);source.connect(analyser);listening=true;noiseFloor=.00018;envelope=.00018;lastRecent=.00018;lastAttack=0;capturing=false;captureFrame=0;votes=[];current=-1;listen.disabled=false;listen.textContent='Stop';listen.classList.add('on');status.textContent='Listening for key strikes';loop();}catch(e){listen.disabled=false;listen.textContent='Try again';status.textContent='Microphone error: '+(e.message||e.name||'Unknown');}}
function stop(){listening=false;if(raf)cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(function(t){t.stop();});if(ctx)ctx.close();stream=ctx=null;listen.disabled=false;listen.textContent='Start listening';listen.classList.remove('on');status.textContent='Tap Start listening';activate(-1);readout.textContent='Note: —';}
listen.onclick=function(){listening?stop():start();};window.onerror=function(msg){status.textContent='App error: '+msg;};
})();
</script></body></html>
