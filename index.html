<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Piano Glow</title>
<style>
:root{--glow:#60a5fa}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{position:fixed;inset:0}#app{position:absolute;inset:0;width:100vw;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr 30vh}header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #ffffff25}h1{margin:0;font-size:1.25rem}p{margin:3px 0 0;color:#aeb8d0;font-size:.85rem}.controls{display:flex;gap:10px}button{border:1px solid #ffffff28;background:#171b2d;color:#fff;border-radius:14px;padding:11px 14px;font:inherit;font-weight:800}#listen.on{background:#dc2626}#colour{width:48px;height:48px;padding:6px}#colour i{display:block;width:100%;height:100%;border-radius:8px;background:var(--glow);border:3px solid #fff}#palette{display:none;position:absolute;right:16px;top:72px;z-index:30;width:220px;padding:12px;border-radius:18px;background:#171b2d;border:1px solid #ffffff2b;grid-template-columns:repeat(5,1fr);gap:9px}#palette.open{display:grid}.swatch{height:34px;padding:0;border-radius:9px}#visual{position:relative;overflow:hidden;background:radial-gradient(circle at 20% 10%,#60a5fa26,transparent 36%)}.pill{position:absolute;top:16px;z-index:10;padding:8px 12px;border-radius:999px;background:#0008;border:1px solid #ffffff29;color:#c5cce0}#status{left:50%;transform:translateX(-50%);white-space:nowrap}#readout{left:16px}#keySizeControl{position:absolute;right:16px;top:14px;z-index:12;width:150px;text-align:center;color:#fff;font-size:.75rem;font-weight:700;text-shadow:0 1px 3px #000}#keySizeControl label{display:block;margin-bottom:3px}#keySize{display:block;width:100%;height:22px;accent-color:#fff}.bar{position:absolute;bottom:-8px;min-height:54px;border-radius:9px 9px 3px 3px;background:var(--glow);display:grid;place-items:center;font-weight:900;text-shadow:0 1px 3px #000;box-shadow:0 0 20px var(--glow);animation:rise 2.8s linear forwards;overflow:hidden}@keyframes rise{to{transform:translateY(-72vh);opacity:0}}#keyboardWrap{overflow-x:auto;overflow-y:hidden;background:#060810;-webkit-overflow-scrolling:touch}#keyboard{height:100%;min-width:1300px;position:relative;display:flex}.white{position:relative;flex:1;height:100%;background:linear-gradient(#fff,#e8e8ef);border-right:1px solid #999;color:#171923;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:800}.black{position:absolute;top:0;height:62%;width:1.25%;transform:translateX(-50%);z-index:5;background:linear-gradient(#272a36,#030407);border-radius:0 0 5px 5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:.55rem;font-weight:800}.active{background:var(--glow)!important}@media(orientation:portrait){#app{grid-template-rows:auto 1fr 24vh}#keyboard{min-width:1500px}#keySizeControl{width:125px}}
</style></head><body>
<div id="app"><header><div><h1>Piano Glow</h1><p>One key strike creates one note.</p></div><div class="controls"><button id="listen">Start listening</button><button id="colour" aria-label="Choose colour"><i></i></button></div></header><div id="palette"></div><section id="visual"><div id="readout" class="pill">Note: —</div><div id="status" class="pill">Tap Start listening</div><div id="keySizeControl"><label for="keySize">Key width</label><input id="keySize" type="range" min="850" max="2400" step="50" value="1300" aria-label="Adjust piano key width"></div></section><section id="keyboardWrap"><div id="keyboard"></div></section></div>
<script>
(function(){'use strict';
var names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],whites={C:1,D:1,E:1,F:1,G:1,A:1,B:1},colours=['#60a5fa','#22d3ee','#34d399','#a3e635','#facc15','#fb923c','#f87171','#f472b6','#c084fc','#818cf8','#fff','#94a3b8','#14b8a6','#84cc16','#eab308'];
var keyboard=document.getElementById('keyboard'),wrap=document.getElementById('keyboardWrap'),visual=document.getElementById('visual'),listen=document.getElementById('listen'),status=document.getElementById('status'),readout=document.getElementById('readout'),palette=document.getElementById('palette'),colour=document.getElementById('colour'),keySize=document.getElementById('keySize');
var keys={},whiteMidis=[],stream,ctx,analyser,timeData,byteData,yin,shortData,mediumData,longData,raf,listening=false,noiseFloor=.00012,envelope=.00012,lastRecent=.00012,lastAttack=0,capturing=false,captureFrame=0,candidates=[],current=-1,highlightTimer=0,locked=false,lockPeak=0,quietFrames=0,riseFrames=0;
function info(m){return{name:names[m%12],oct:Math.floor(m/12)-1};}
for(var m=21;m<=108;m++)if(whites[info(m).name])whiteMidis.push(m);
whiteMidis.forEach(function(m){var e=document.createElement('div'),n=info(m);e.className='white';e.textContent=n.name==='C'?n.name+n.oct:n.name;keyboard.appendChild(e);keys[m]=e;});
for(var x=21;x<=108;x++){var n=info(x);if(!whites[n.name]){var b=document.createElement('div'),count=whiteMidis.filter(function(v){return v<x;}).length;b.className='black';b.textContent=n.name;b.style.left=(count/whiteMidis.length*100)+'%';keyboard.appendChild(b);keys[x]=b;}}
function centreMiddleC(){var c=keys[60];if(c)wrap.scrollLeft=Math.max(0,c.offsetLeft-wrap.clientWidth/2);}
function syncBar(e){var m=Number(e.dataset.midi),k=keys[m];if(!k)return;var kr=k.getBoundingClientRect(),vr=visual.getBoundingClientRect();e.style.width=Math.max(1,kr.width)+'px';e.style.left=(kr.left-vr.left)+'px';}
function syncBars(){var bars=visual.querySelectorAll('.bar');for(var i=0;i<bars.length;i++)syncBar(bars[i]);}
setTimeout(function(){centreMiddleC();syncBars();},80);
keySize.oninput=function(){var oldWidth=keyboard.scrollWidth,centre=wrap.scrollLeft+wrap.clientWidth/2,ratio=oldWidth?centre/oldWidth:.5;keyboard.style.minWidth=this.value+'px';requestAnimationFrame(function(){wrap.scrollLeft=Math.max(0,keyboard.scrollWidth*ratio-wrap.clientWidth/2);syncBars();});};
wrap.addEventListener('scroll',syncBars,{passive:true});window.addEventListener('resize',syncBars);
colours.forEach(function(c){var b=document.createElement('button');b.className='swatch';b.style.background=c;b.onclick=function(){document.documentElement.style.setProperty('--glow',c);palette.classList.remove('open');};palette.appendChild(b);});colour.onclick=function(){palette.classList.toggle('open');};
function readAudio(){if(typeof analyser.getFloatTimeDomainData==='function'){analyser.getFloatTimeDomainData(timeData);return timeData;}analyser.getByteTimeDomainData(byteData);for(var i=0;i<byteData.length;i++)timeData[i]=(byteData[i]-128)/128;return timeData;}
function rms(buf,start){var s=0,i=start||0,count=buf.length-i;for(;i<buf.length;i++){var v=buf[i];s+=v*v;}return Math.sqrt(s/Math.max(1,count));}
function copyTail(source,target){var start=source.length-target.length;for(var i=0;i<target.length;i++)target[i]=source[start+i];}
function localMinimum(target,minTau,maxTau){var start=Math.max(minTau,target-3),end=Math.min(maxTau-1,target+3),best=start;for(var t=start+1;t<=end;t++)if(yin[t]<yin[best])best=t;return best;}
function detectPitch(buf,sr){var half=buf.length>>1,minTau=Math.max(2,Math.floor(sr/4200)),maxTau=Math.min(Math.floor(sr/27),half-2),tau,i,sum,running=0;for(tau=0;tau<=maxTau;tau++)yin[tau]=0;for(tau=1;tau<=maxTau;tau++){sum=0;for(i=0;i<half;i+=3){var d=buf[i]-buf[i+tau];sum+=d*d;}yin[tau]=sum;}yin[0]=1;for(tau=1;tau<=maxTau;tau++){running+=yin[tau];yin[tau]=yin[tau]*tau/(running||1);}var chosen=-1,best=1;for(tau=minTau;tau<maxTau;tau++){if(yin[tau]<.14&&yin[tau]<=yin[tau-1]&&yin[tau]<yin[tau+1]){chosen=tau;break;}if(yin[tau]<best){best=yin[tau];chosen=tau;}}if(chosen<0||yin[chosen]>.26)return null;while(chosen+1<maxTau&&yin[chosen+1]<yin[chosen])chosen++;var doubleTau=chosen*2<=maxTau?localMinimum(chosen*2,minTau,maxTau):-1,halfTau=chosen/2>=minTau?localMinimum(Math.round(chosen/2),minTau,maxTau):-1,tripleTau=chosen*3<=maxTau?localMinimum(chosen*3,minTau,maxTau):-1;if(doubleTau>0&&yin[doubleTau]+.05<yin[chosen])chosen=doubleTau;if(tripleTau>0&&yin[tripleTau]+.07<yin[chosen])chosen=tripleTau;if(halfTau>0&&yin[halfTau]+.14<yin[chosen]&&yin[halfTau]<.10)chosen=halfTau;var better=chosen,a=yin[chosen-1],b=yin[chosen],c=yin[chosen+1],den=a-2*b+c;if(Math.abs(den)>1e-9)better=chosen+(a-c)/(2*den);return{freq:sr/better,quality:1-yin[chosen]};}
function midiFloat(f){return 69+12*Math.log(f/440)/Math.log(2);}
function clearActive(){Object.keys(keys).forEach(function(k){keys[k].classList.remove('active');});}
function activate(m){clearActive();if(highlightTimer)clearTimeout(highlightTimer);if(keys[m])keys[m].classList.add('active');highlightTimer=setTimeout(function(){if(keys[m])keys[m].classList.remove('active');highlightTimer=0;},60);}
function addBar(m,level){var k=keys[m];if(!k)return;var e=document.createElement('div');e.className='bar';e.dataset.midi=String(m);e.textContent=info(m).name;e.style.height=(52+Math.min(75,level*2000))+'px';visual.appendChild(e);syncBar(e);e.onanimationend=function(){e.remove();};}
function showNote(m,level){current=m;activate(m);var n=info(m);readout.textContent='Note: '+n.name+n.oct;addBar(m,level);}
function addCandidate(buf,source){var p=detectPitch(buf,ctx.sampleRate);if(!p||p.quality<.74)return;var mf=midiFloat(p.freq),m=Math.round(mf);if(m<21||m>108||Math.abs(mf-m)>.14)return;candidates.push({note:m,quality:p.quality,distance:Math.abs(mf-m),source:source});}
function isHarmonicInterval(a,b){var d=Math.abs(a-b);return d===12||d===19||d===24||d===7||d===16;}
function chooseCandidate(){if(candidates.length<8)return null;var totals={},i;for(i=0;i<candidates.length;i++){var c=candidates[i];if(!totals[c.note])totals[c.note]={note:c.note,count:0,score:0,distance:0,sources:{}};totals[c.note].count++;totals[c.note].score+=c.quality;totals[c.note].distance+=c.distance;totals[c.note].sources[c.source]=1;}var ranked=Object.keys(totals).map(function(k){var r=totals[k];r.distance/=r.count;r.sourceCount=Object.keys(r.sources).length;r.averageQuality=r.score/r.count;return r;});ranked.sort(function(a,b){return b.count-a.count||b.sourceCount-a.sourceCount||b.score-a.score||a.distance-b.distance;});var best=ranked[0],second=ranked[1];if(!best)return null;if(best.count<6||best.sourceCount<2||best.averageQuality<.76||best.distance>.12)return null;if(!best.sources.s||!best.sources.m)return null;var stable=0,tail=Math.min(candidates.length,10);for(i=candidates.length-tail;i<candidates.length;i++)if(candidates[i].note===best.note)stable++;if(stable<6)return null;if(second){var diff=Math.abs(best.note-second.note);if(diff>0&&diff<=2){if(best.count<second.count*2.4||best.score<second.score*1.9||second.averageQuality>best.averageQuality*.92)return null;}else if(isHarmonicInterval(best.note,second.note)){var lower=best.note<second.note?best:second,higher=best.note<second.note?second:best,lowerFast=(lower.sources.s?1:0)+(lower.sources.m?1:0),higherFast=(higher.sources.s?1:0)+(higher.sources.m?1:0);if(higher.count>=lower.count*1.35&&higherFast>=lowerFast&&higher.averageQuality>=lower.averageQuality-.02)best=higher;else if(lower.count>=higher.count*1.15||lowerFast>higherFast)best=lower;else return null;if(best.count<5||best.averageQuality<.74||!best.sources.s||!best.sources.m)return null;}else if(best.count-second.count<3||best.score<second.score*1.5)return null;}var share=best.count/candidates.length;if(share<.55)return null;return best.note;}
function enterLock(level,recent){capturing=false;candidates=[];locked=true;lockPeak=Math.max(level,recent,lockPeak);quietFrames=0;riseFrames=0;}
function loop(){if(!listening)return;try{var buf=readAudio(),level=rms(buf),recent=rms(buf,buf.length-512),threshold=Math.max(.00022,noiseFloor*1.35),now=performance.now();if(level<threshold*1.05)noiseFloor=noiseFloor*.994+level*.006;if(locked){if(recent>lockPeak)lockPeak=recent;var release=Math.max(threshold*1.15,noiseFloor*2.4,lockPeak*.16,.00024);if(recent<release&&level<release*1.2){quietFrames++;if(quietFrames>=10){locked=false;quietFrames=0;lockPeak=0;envelope=Math.min(envelope,Math.max(noiseFloor,recent)*1.15);}}else quietFrames=0;envelope=envelope*.97+recent*.03;lastRecent=lastRecent*.7+recent*.3;syncBars();raf=requestAnimationFrame(loop);return;}var attackFloor=Math.max(.0004,noiseFloor*3.2,envelope*1.65,threshold*1.8),jump=recent-lastRecent,sharp=recent>attackFloor&&recent>lastRecent*1.28&&jump>Math.max(.00014,noiseFloor*1.1)&&recent>envelope*1.5;if(sharp)riseFrames++;else riseFrames=0;var cooldown=now-lastAttack>160;if(!capturing&&riseFrames>=2&&cooldown){capturing=true;captureFrame=0;candidates=[];lastAttack=now;riseFrames=0;}if(capturing){captureFrame++;copyTail(buf,shortData);copyTail(buf,mediumData);copyTail(buf,longData);if(captureFrame>=2&&captureFrame<=14){addCandidate(shortData,'s');addCandidate(mediumData,'m');if(captureFrame>=4)addCandidate(longData,'l');}if(captureFrame>=14){var chosen=chooseCandidate();if(chosen!==null)showNote(chosen,level);enterLock(level,recent);}}envelope=envelope*.95+recent*.05;lastRecent=lastRecent*.62+recent*.38;syncBars();raf=requestAnimationFrame(loop);}catch(e){listening=false;status.textContent='App error: '+(e.message||e.name||'Unknown');listen.textContent='Try again';listen.classList.remove('on');listen.disabled=false;}}
async function start(){listen.disabled=true;listen.textContent='Starting…';status.textContent='Waiting for microphone…';try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('Microphone not supported in this browser');stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});var AC=window.AudioContext||window.webkitAudioContext;if(!AC)throw new Error('Audio not supported');ctx=new AC();if(ctx.state==='suspended')await ctx.resume();var source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=0;timeData=new Float32Array(analyser.fftSize);byteData=new Uint8Array(analyser.fftSize);yin=new Float32Array(analyser.fftSize/2+1);shortData=new Float32Array(2048);mediumData=new Float32Array(4096);longData=new Float32Array(6144);source.connect(analyser);listening=true;noiseFloor=.00012;envelope=.00012;lastRecent=.00012;lastAttack=0;capturing=false;captureFrame=0;candidates=[];current=-1;locked=false;lockPeak=0;quietFrames=0;riseFrames=0;listen.disabled=false;listen.textContent='Stop';listen.classList.add('on');status.textContent='Listening for clean key strikes';loop();}catch(e){listen.disabled=false;listen.textContent='Try again';status.textContent='Microphone error: '+(e.message||e.name||'Unknown');}}
function stop(){listening=false;if(raf)cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(function(t){t.stop();});if(ctx)ctx.close();stream=ctx=null;if(highlightTimer)clearTimeout(highlightTimer);highlightTimer=0;capturing=false;candidates=[];locked=false;lockPeak=0;quietFrames=0;riseFrames=0;listen.disabled=false;listen.textContent='Start listening';listen.classList.remove('on');status.textContent='Tap Start listening';clearActive();readout.textContent='Note: —';}
listen.onclick=function(){listening?stop():start();};window.onerror=function(msg){status.textContent='App error: '+msg;};
})();
</script></body></html>
