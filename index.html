<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Piano Glow</title><body style="margin:0;background:#090b14;color:white;font-family:sans-serif"><div id="loading" style="padding:24px">Loading Piano Glow…</div><script>(async()=>{try{let s="";for(const p of["app.gz.1","app.gz.2","app.gz.3"]){const r=await fetch(p+"?v=3",{cache:"no-store"});if(!r.ok)throw new Error("Missing app file: "+p);s+=await r.text()}s=s.replace(/-/g,"+").replace(/_/g,"/").replace(/[^A-Za-z0-9+\/]/g,"");while(s.length%4)s+="=";const decoded=atob(s);const b=Uint8Array.from(decoded,c=>c.charCodeAt(0));let t=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();const storageKey="pianoGlowSettingsV1";let saved=null;try{saved=JSON.parse(localStorage.getItem(storageKey)||"null")}catch(e){}if(saved&&typeof saved==="object"){const values={keySize:saved.keySize,micSensitivity:saved.micSensitivity,accuracy:saved.accuracy,speed:saved.speed,duplicateGuard:saved.duplicateGuard,softNoteBoost:saved.softNoteBoost};for(const [id,value] of Object.entries(values)){if(value!==undefined&&value!==null){const re=new RegExp('(<input[^>]*id="'+id+'"[^>]*value=")[^"]*(")');t=t.replace(re,'$1'+String(value)+'$2')}}if(typeof saved.glow==="string"&&/^#[0-9a-f]{3,8}$/i.test(saved.glow))t=t.replace(/--glow:#[0-9a-f]{3,8}/i,"--glow:"+saved.glow)}const persistence='<script>(function(){var K="pianoGlowSettingsV1",ids=["keySize","micSensitivity","accuracy","speed","duplicateGuard","softNoteBoost"];function save(){try{var v={};ids.forEach(function(id){var e=document.getElementById(id);if(e)v[id]=Number(e.value)});v.glow=getComputedStyle(document.documentElement).getPropertyValue("--glow").trim()||"#60a5fa";localStorage.setItem(K,JSON.stringify(v))}catch(e){}}ids.forEach(function(id){var e=document.getElementById(id);if(e){e.addEventListener("input",save);e.addEventListener("change",save)}});document.querySelectorAll(".swatch").forEach(function(e){e.addEventListener("click",function(){setTimeout(save,0)})});window.addEventListener("pagehide",save);window.addEventListener("beforeunload",save);save()})();<\/script>';t=t.replace("</body>",persistence+"</body>");document.open();document.write(t);document.close()}catch(e){document.getElementById("loading").textContent="Piano Glow could not load: "+e.message}})();</script>
