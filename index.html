<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b14"><title>Piano Glow</title>
<style>
:root{--glow:#60a5fa}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090b14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{touch-action:manipulation}#app{height:100svh;display:grid;grid-template-rows:auto 1fr 30vh;background:radial-gradient(circle at 20% 10%,rgba(96,165,250,.15),transparent 36%),#090b14}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:max(12px,env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid rgba(255,255,255,.16)}h1{margin:0;font-size:1.25rem}p{margin:3px 0 0;color:#aeb8d0;font-size:.85rem}.controls{display:flex;gap:10px;align-items:center}button{border:1px solid rgba(255,255,255,.18);background:#171b2d;color:#fff;border-radius:14px;padding:11px 14px;font:inherit;font-weight:800}button:disabled{opacity:.65}#listen.on{background:#dc2626}#colour{width:48px;height:48px;padding:6px;background:conic-gradient(red,#ff0,#0f0,#0ff,#00f,#f0f,red)}#colour i{display:block;width:100%;height:100%;border-radius:9px;background:var(--glow);border:3px solid white}#palette{display:none;position:absolute;right:16px;top:74px;z-index:30;width:220px;padding:12px;border-radius:18px;background:#171b2d;border:1px solid rgba(255,255,255,.18);grid-template-columns:repeat(5,1fr);gap:9px}#palette.open{display:grid}.swatch{height:34px;padding:0;border-radius:9px}#visual{position:relative;overflow:hidden}.pill{position:absolute;top:16px;z-index:10;padding:8px 12px;border-radius:999px;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.16);color:#b7c0d6;max-width:92%;text-align:center}#status{left:50%;transform:translateX(-50%)}#readout{left:16px;border-radius:14px}.bar{position:absolute;bottom:-8px;width:25px;min-height:54px;border-radius:9px 9px 3px 3px;background:var(--glow);display:grid;place-items:center;font-weight:900;text-shadow:0 1px 3px #000;box-shadow:0 0 20px var(--glow);animation:rise 4.4s linear forwards}@keyframes rise{to{transform:translateY(-72vh);opacity:0}}#keyboardWrap{overflow-x:auto;overflow-y:hidden;background:#060810;-webkit-overflow-scrolling:touch}#keyboard{height:100%;min-width:1300px;position:relative;display:flex;padding-bottom:max(8px,env(safe-area-inset-bottom))}.white{position:relative;flex:1;height:100%;background:linear-gradient(#fff,#e8e8ef);border-right:1px solid #999;color:#171923;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:800}.black{position:absolute;top:0;height:62%;width:1.25%;transform:translateX(-50%);z-index:5;background:linear-gradient(#272a36,#030407);border-radius:0 0 5px 5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:.55rem;font-weight:800}.active{background:var(--glow)!important}@media(orientation:portrait){#app{grid-template-rows:auto 1fr 24vh}#keyboard{min-width:1500px}}
</style></head>
<body><div id="app"><header><div><h1>Piano Glow</h1><p>Play one piano note at a time.</p></div><div class="controls"><button id="listen" type="button">Start listening</button><button id="colour" type="button" aria-label="Choose colour"><i></i></button></div></header><div id="palette"></div><section id="visual"><div id="readout" class="pill">Note: —</div><div id="status" class="pill">Tap Start listening</div></section><section id="keyboardWrap"><div id="keyboard"></div></section></div>
<script>
(function(){'use strict';
var names=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],whites={C:1,D:1,E:1,F:1,G:1,A:1,B:1},colours=['#60a5fa','#22d3ee','#34d399','#a3e635','#facc15','#fb923c','#f87171','#f472b6','#c084fc','#818cf8','#fff','#94a3b8','#14b8a6','#84cc16','#eab308'];
var keyboard=document.getElementById('keyboard'),wrap=document.getElementById('keyboardWrap'),visual=document.getElementById('visual'),listen=document.getElementById('listen'),status=document.getElementById('status'),readout=document.getElementById('readout'),palette=document.getElementById('palette'),colour=document.getElementById('colour');
var keys={},whiteMidis=[],stream,ctx,analyser,data,raf,listening=false,lastBar=0,candidates=[],shownMidi=null,silenceFrames=0,lastLevel=0,onsetWait=0;
function info(m){return{name:names[m%12],oct:Math.floor(m/12)-1};}function midi(f){return 69+12*Math.log(f/440)/Math.log(2);}function freq(m){return 440*Math.pow(2,(m-69)/12);}
for(var m=21;m<=108;m++)if(whites[info(m).name])whiteMidis.push(m);whiteMidis.forEach(function(m){var e=document.createElement('div'),n=info(m);e.className='white';e.textContent=n.name==='C'?n.name+n.oct:n.name;e.dataset.m=m;keyboard.appendChild(e);keys[m]=e;});for(var x=21;x<=108;x++){var n=info(x);if(!whites[n.name]){var b=document.createElement('div'),count=whiteMidis.filter(function(v){return v<x;}).length;b.className='black';b.textContent=n.name;b.style.left=(count/whiteMidis.length*100)+'%';keyboard.appendChild(b);keys[x]=b;}}
setTimeout(function(){var c=keys[60];if(c)wrap.scrollLeft=Math.max(0,c.offsetLeft-wrap.clientWidth/2);},80);colours.forEach(function(c){var b=document.createElement('button');b.type='button';b.className='swatch';b.style.background=c;b.onclick=function(){document.documentElement.style.setProperty('--glow',c);palette.classList.remove('open');};palette.appendChild(b);});colour.onclick=function(){palette.classList.toggle('open');};
function rms(buf){var s=0;for(var i=0;i<buf.length;i++)s+=buf[i]*buf[i];return Math.sqrt(s/buf.length);}
function yin(buf,sr){var level=rms(buf);if(level<0.012)return null;var minTau=Math.floor(sr/2100),maxTau=Math.min(Math.floor(sr/27.5),Math.floor(buf.length/2)-1),size=maxTau+1,diff=new Float32Array(size),cmnd=new Float32Array(size);for(var tau=1;tau<=maxTau;tau++){var sum=0,limit=buf.length-tau;for(var i=0;i<limit;i++){var d=buf[i]-buf[i+tau];sum+=d*d;}diff[tau]=sum;}cmnd[0]=1;var running=0;for(var t=1;t<=maxTau;t++){running+=diff[t];cmnd[t]=running?diff[t]*t/running:1;}var threshold=.16,best=-1;for(var t=minTau;t<=maxTau;t++){if(cmnd[t]<threshold){while(t+1<=maxTau&&cmnd[t+1]<cmnd[t])t++;best=t;break;}}if(best<0){var lowest=1;for(var q=minTau;q<=maxTau;q++)if(cmnd[q]<cmnd[lowest])lowest=q;if(cmnd[lowest]>.28)return null;best=lowest;}var better=best;if(best>1&&best<maxTau){var s0=cmnd[best-1],s1=cmnd[best],s2=cmnd[best+1],den=2*(2*s1-s2-s0);if(den)better=best+(s2-s0)/den;}return{f:sr/better,r:level,confidence:1-cmnd[best]};}
function harmonicCorrect(p){var raw=midi(p.f),nearest=Math.round(raw),choices=[nearest,nearest-12,nearest+12],best=nearest,bestScore=999;for(var i=0;i<choices.length;i++){var m=choices[i];if(m<21||m>108)continue;var cents=Math.abs(1200*Math.log(p.f/freq(m))/Math.log(2));var penalty=cents;if(m===nearest-12&&p.confidence>.82)penalty-=18;if(m===nearest+12)penalty+=20;if(penalty<bestScore){bestScore=penalty;best=m;}}return{m:best,cents:1200*Math.log(p.f/freq(best))/Math.log(2)};}
function median(a){var b=a.slice().sort(function(x,y){return x-y;});return b[Math.floor(b.length/2)];}
function activate(m){Object.keys(keys).forEach(function(k){keys[k].classList.remove('active');});if(keys[m])keys[m].classList.add('active');}
function makeBar(m,r){var k=keys[m];if(!k)return;var kr=k.getBoundingClientRect(),wr=wrap.getBoundingClientRect(),px=kr.left+kr.width/2-wr.left,e=document.createElement('div');e.className='bar';e.textContent=info(m).name;e.style.left=(px-12)+'px';e.style.height=(52+Math.min(80,r*950))+'px';visual.appendChild(e);e.onanimationend=function(){e.remove();};}
function show(m,r,cents){shownMidi=m;activate(m);var n=info(m),direction=cents>8?' sharp':cents<-8?' flat':'';readout.textContent='Note: '+n.name+n.oct+direction;var now=Date.now();if(now-lastBar>300){makeBar(m,r);lastBar=now;}}
function loop(){if(!listening)return;analyser.getFloatTimeDomainData(data);var level=rms(data);if(level>Math.max(.02,lastLevel*1.8))onsetWait=2;lastLevel=lastLevel*.82+level*.18;if(onsetWait>0){onsetWait--;raf=requestAnimationFrame(loop);return;}var p=yin(data,ctx.sampleRate);if(!p||p.confidence<.68){silenceFrames++;if(silenceFrames>8){candidates=[];shownMidi=null;activate(-1);readout.textContent='Note: —';}raf=requestAnimationFrame(loop);return;}silenceFrames=0;var fixed=harmonicCorrect(p);if(Math.abs(fixed.cents)>48){raf=requestAnimationFrame(loop);return;}candidates.push(fixed.m);if(candidates.length>7)candidates.shift();if(candidates.length>=5){var med=Math.round(median(candidates)),same=candidates.filter(function(v){return Math.abs(v-med)<=0;}).length;if(same>=4){if(shownMidi===null||med===shownMidi||Math.abs(med-shownMidi)<=2||same>=6)show(med,p.r,fixed.cents);}}raf=requestAnimationFrame(loop);}
function friendlyError(e){var n=e&&e.name||'UnknownError';if(n==='NotAllowedError')return'Microphone permission was denied.';if(n==='NotReadableError')return'The microphone is busy in another app.';return'Microphone error: '+n+(e&&e.message?' — '+e.message:'');}
async function start(){listen.disabled=true;listen.textContent='Starting…';status.textContent='Waiting for microphone…';try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC();await ctx.resume();var source=ctx.createMediaStreamSource(stream);analyser=ctx.createAnalyser();analyser.fftSize=8192;analyser.smoothingTimeConstant=0;data=new Float32Array(analyser.fftSize);source.connect(analyser);listening=true;listen.disabled=false;listen.textContent='Stop';listen.classList.add('on');status.textContent='Listening — play one clear note';loop();}catch(e){listen.disabled=false;listen.textContent='Try again';status.textContent=friendlyError(e);}}
function stop(){listening=false;if(raf)cancelAnimationFrame(raf);if(stream)stream.getTracks().forEach(function(t){t.stop();});if(ctx)ctx.close();stream=ctx=null;candidates=[];shownMidi=null;activate(-1);listen.disabled=false;listen.textContent='Start listening';listen.classList.remove('on');status.textContent='Tap Start listening';readout.textContent='Note: —';}
listen.onclick=function(){listening?stop():start();};window.onerror=function(msg){status.textContent='App error: '+msg;};
})();
</script></body></html>
