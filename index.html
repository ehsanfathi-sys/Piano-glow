<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Piano Glow</title>
  <style>
    :root{--glow:#60a5fa;--keyboard-width:1400px;--panel:#171b2d;--muted:#aeb8d0;--rise-duration:4s}
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000!important;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{position:fixed;inset:0;background-color:#000!important;background-image:none!important}
    button,input{font:inherit}
    #app{position:absolute;inset:0;width:100vw;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr 30vh;background:#000!important}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #ffffff25;background:#000!important;z-index:20}
    h1{margin:0;font-size:1.2rem;line-height:1.1}
    header p{margin:4px 0 0;color:var(--muted);font-size:.78rem}
    .controls{display:flex;gap:8px;align-items:center;min-width:min(620px,72vw)}
    button{border:1px solid #ffffff28;background:var(--panel);color:#fff;border-radius:13px;padding:10px 13px;font-weight:800;min-height:44px}
    button:disabled{opacity:.55}
    .speed-control{display:grid;grid-template-columns:auto minmax(90px,150px) 30px;align-items:center;gap:7px;min-height:44px;padding:6px 10px;border:1px solid #ffffff28;border-radius:13px;background:var(--panel);white-space:nowrap}
    .speed-control label{font-size:.72rem;font-weight:850;color:#eef2ff}
    .speed-control input{width:100%;min-width:90px;accent-color:var(--glow)}
    .speed-control output{font-size:.75rem;font-weight:900;text-align:right;color:#fff}
    #listen{flex:1;min-width:0;padding-left:24px;padding-right:24px;font-size:1rem}
    #listen.on{background:#dc2626}
    #colour{flex:0 0 46px;width:46px;padding:6px}
    #colour i{display:block;width:100%;height:30px;border-radius:8px;background:var(--glow);border:2px solid #fff}
    #settingsButton{flex:0 0 46px;width:46px;padding:0;font-size:1.15rem}
    #palette{display:none;position:absolute;right:62px;top:68px;z-index:40;width:220px;padding:12px;border-radius:18px;background:var(--panel);border:1px solid #ffffff2b;grid-template-columns:repeat(5,1fr);gap:9px;box-shadow:0 14px 40px #0008}
    #palette.open{display:grid}
    .swatch{height:34px;padding:0;border-radius:9px;min-height:34px}
    #settings{display:none;position:absolute;right:14px;top:68px;z-index:45;width:min(310px,calc(100vw - 28px));padding:14px;border-radius:18px;background:var(--panel);border:1px solid #ffffff2b;box-shadow:0 14px 40px #0009}
    #settings.open{display:block}
    .setting{margin-bottom:13px}
    .setting:last-child{margin-bottom:0}
    .setting-row{display:flex;justify-content:space-between;gap:14px;margin-bottom:5px;font-size:.8rem;font-weight:750}
    .setting small{display:block;color:var(--muted);font-size:.68rem;line-height:1.3;margin-top:3px}
    input[type=range]{width:100%;accent-color:var(--glow)}
    #visual{position:relative;overflow:hidden;background:#000!important;background-color:#000!important;background-image:none!important}
    .pill{position:absolute;top:14px;z-index:10;padding:8px 12px;border-radius:999px;background:#0009;border:1px solid #ffffff29;color:#d4daf0;font-size:.78rem;backdrop-filter:blur(8px)}
    #readout{left:14px;font-weight:850}
    #latency{right:14px;color:#aeb8d0}
    .bar{position:absolute;bottom:-10px;min-height:24px;border:3px solid #000;border-radius:9px 9px 3px 3px;background:var(--glow);background-clip:padding-box;display:block;padding:0;color:transparent!important;font-size:0!important;line-height:0!important;text-shadow:none!important;box-shadow:0 0 22px var(--glow);animation:none;overflow:hidden;will-change:height,transform,opacity;z-index:2}
    .bar *,.bar .label{display:none!important;visibility:hidden!important;color:transparent!important;font-size:0!important;text-shadow:none!important}
    .bar.released{animation:rise var(--rise-duration) linear forwards}
    #visual.dense-passage .bar{box-shadow:0 0 7px var(--glow)}
    #visual.dense-passage .smoke{opacity:.24;filter:none;box-shadow:0 0 5px var(--glow)}
    .smoke{position:absolute;display:block;border-radius:50%;pointer-events:none;z-index:3;background:radial-gradient(circle,#fff 0 15%,var(--glow) 34%,transparent 78%);filter:blur(1.25px);opacity:.72;box-shadow:0 0 15px var(--glow),0 0 5px #fff8;animation:smoke-drift 1.5s ease-out forwards;will-change:transform,opacity}
    @keyframes rise{0%{transform:translateY(0);opacity:1}82%{opacity:1}100%{transform:translateY(-78vh);opacity:0}}
    @keyframes smoke-drift{0%{transform:translate3d(0,0,0) scale(.78);opacity:.7}45%{opacity:.48}100%{transform:translate3d(calc(1.18 * var(--drift)),calc(-1.16 * var(--smoke-rise)),0) scale(1.95);opacity:0}}
    #keyboardWrap{overflow-x:auto;overflow-y:hidden;background:#000!important;-webkit-overflow-scrolling:touch}
    #keyboard{height:100%;min-width:var(--keyboard-width);position:relative;display:flex;user-select:none;background:#000!important}
    .white{position:relative;flex:1;height:100%;background:linear-gradient(#fff,#e8e8ef);border-right:1px solid #999;color:#171923;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;font-weight:800;font-size:.72rem;transition:background .05s}
    .black{position:absolute;top:0;height:62%;width:1.25%;transform:translateX(-50%);z-index:5;background:linear-gradient(#272a36,#030407);border-radius:0 0 5px 5px;color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;font-size:.5rem;font-weight:800;transition:background .05s}
    .active{background:var(--glow)!important;box-shadow:0 0 25px var(--glow)}
    .cal-target{outline:4px solid #facc15;outline-offset:-4px;box-shadow:0 0 28px #facc15!important}
    #calibration{display:none;position:absolute;inset:0;z-index:60;background:#000!important;backdrop-filter:none;padding:18px;place-items:center}
    #calibration.open{display:grid}
    #calCard{width:min(560px,100%);background:#000;border:1px solid #ffffff2b;border-radius:22px;padding:22px;text-align:center;box-shadow:0 18px 55px #000b}
    #calTitle{font-size:2rem;margin:0 0 8px}
    #calDetail{color:#d4daf0;line-height:1.45;min-height:3em}
    #calProgress{margin:14px 0;color:#aeb8d0;font-weight:750}
    #calActions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
    @media(max-width:760px){header{gap:8px;padding:9px 10px}header>div:first-child{display:none}.controls{width:100%;min-width:0}.speed-control{grid-template-columns:auto minmax(64px,1fr) 24px;flex:1;padding:5px 8px}.speed-control input{min-width:64px}#listen{flex:1.15;padding-left:12px;padding-right:12px}#colour,#settingsButton{flex-basis:42px;width:42px}}
    @media(orientation:portrait){#app{grid-template-rows:auto 1fr 24vh}#keyboard{min-width:max(var(--keyboard-width),1500px)}#latency{display:none}header p{display:none}.controls{gap:6px}button{padding:9px 9px}#listen{padding-left:10px;padding-right:10px}}
    @media(prefers-reduced-motion:reduce){.smoke{display:none}}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div><h1>Piano Glow</h1><p>Neural 88-key onset-and-frame detection</p></div>
      <div class="controls">
        <div class="speed-control" aria-label="Released bar speed">
          <label for="riseSpeed">Speed</label>
          <input id="riseSpeed" type="range" min="1" max="100" value="50" step="1">
          <output id="riseSpeedValue" for="riseSpeed">50</output>
        </div>
        <button id="listen">Start listening</button>
        <button id="colour" aria-label="Choose colour"><i></i></button>
        <button id="settingsButton" aria-label="Detection settings">⚙︎</button>
      </div>
    </header>
    <button id="calibrate" hidden aria-hidden="true" tabindex="-1" style="display:none!important"></button>
    <div id="palette" aria-label="Colour palette"></div>
    <aside id="settings" aria-label="Detection settings">
      <div class="setting"><div class="setting-row"><label for="confidence">AI confidence</label><output id="confidenceValue">58%</output></div><input id="confidence" type="range" min="35" max="85" value="58" step="1"><small>Higher rejects more doubtful notes.</small></div>
      <div class="setting"><div class="setting-row"><label for="frameConfidence">Sustain confidence</label><output id="frameConfidenceValue">16%</output></div><input id="frameConfidence" type="range" min="6" max="40" value="16" step="1"><small>How strongly the model must believe a key remains down.</small></div>
      <div class="setting"><div class="setting-row"><label for="keySize">Key width</label><output id="keySizeValue">1400 px</output></div><input id="keySize" type="range" min="900" max="2400" value="1400" step="50"></div>
    </aside>
    <section id="visual">
      <div id="readout" class="pill">Note: —</div><div id="latency" class="pill">AI model idle</div>
    </section>
    <template id="status"></template>
    <template id="startupNotice"></template>
    <section id="keyboardWrap"><div id="keyboard"></div></section>
  </div>
  <section id="calibration">
    <div id="calCard">
      <h2 id="calTitle">Play A0</h2>
      <div id="calDetail">The next clear piano strike will be saved as the highlighted key.</div>
      <div id="calProgress">0 of 88 keys saved</div>
      <div id="calActions"><button id="calSkip">Skip this key</button><button id="calCancel">Save and finish later</button><button id="calReset">Reset saved calibration</button></div>
    </div>
  </section>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="rise-speed.js?v=3" defer></script>
  <script src="duration-bars.js?v=26" defer></script>
  <script src="app.js?v=24" defer></script>
</body>
</html>
